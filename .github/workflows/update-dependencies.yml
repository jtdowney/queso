name: Update dependencies

on:
  schedule:
    - cron: "0 10 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: never

jobs:
  update-dependencies:
    name: Update dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Update dependencies
        run: |
          SUMMARY="$RUNNER_TEMP/update-summary.md"
          DETAILS="$RUNNER_TEMP/update-details.md"
          STATUS=0

          : > "$DETAILS"
          for MANIFEST in Cargo.toml launcher/Cargo.toml; do
            OUTPUT=$(cargo update --manifest-path "$MANIFEST" 2>&1) || STATUS=1
            {
              echo "#### $MANIFEST"
              echo '```'
              echo "$OUTPUT"
              echo '```'
            } >> "$DETAILS"
          done

          {
            echo "## Dependency Updates"
            echo ""
            if [ "$STATUS" -eq 0 ]; then
              echo "✅ Dependencies updated successfully"
            else
              echo "⚠️ Some updates may have failed"
            fi
            echo ""
            echo "### Changes"
            cat "$DETAILS"
          } > "$SUMMARY"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-dependencies
          delete-branch: true
          commit-message: "chore: update dependencies"
          title: "chore: update dependencies"
          body-path: ${{ runner.temp }}/update-summary.md
          labels: dependencies
